server:
  port: 8083

spring:
  web:
    error:
      include-message: always
  application:
    name: pedidos-service
  datasource:
    # Base en memoria propia: cada microservicio es dueno de sus datos.
    url: jdbc:h2:mem:pedidosdb
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

# Llamada interna entre servicios: va directo, no pasa por el gateway.
productos:
  url: ${PRODUCTOS_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health
