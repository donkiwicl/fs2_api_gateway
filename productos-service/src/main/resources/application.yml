server:
  port: 8082

spring:
  web:
    error:
      include-message: always
  application:
    name: productos-service
  datasource:
    # Base en memoria propia: cada microservicio es dueno de sus datos.
    url: jdbc:h2:mem:productosdb
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
